<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EElectro - כניסה והרשמה</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">

  <!-- SVG Gradients and Icons Definitions -->
  <svg style="display: none;">
    <defs>
      <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#6366f1" />
        <stop offset="100%" stop-color="#14b8a6" />
      </linearGradient>
    </defs>
  </svg>

  <div class="auth-container">
    <div class="auth-header">
      <div class="auth-logo">
        <svg viewBox="0 0 24 24">
          <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" />
        </svg>
        <span>EElectro</span>
      </div>
      <div class="auth-subtitle">חנות מוצרי החשמל המובילה לבית החכם שלך</div>
    </div>

    <div class="auth-card">
      <div class="auth-tabs">
        <button type="button" class="auth-tab-btn active" id="tab-login" onclick="switchTab('login')">התחברות</button>
        <button type="button" class="auth-tab-btn" id="tab-register" onclick="switchTab('register')">הרשמה</button>
      </div>

      <div class="auth-form-container">
        
        <!-- Login Form -->
        <form id="login-form" class="auth-form active" onsubmit="handleLogin(event)">
          <div class="form-group">
            <label for="login-email">אימייל</label>
            <div class="input-wrapper">
              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"></path>
              </svg>
              <input type="email" id="login-email" required placeholder="name@example.com" style="direction: ltr; text-align: left;">
            </div>
          </div>

          <div class="form-group">
            <label for="login-password">סיסמה</label>
            <div class="input-wrapper">
              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
              </svg>
              <input type="password" id="login-password" required placeholder="••••••••" style="direction: ltr; text-align: left;">
            </div>
          </div>

          <button type="submit" class="auth-btn">
            <span>כניסה לחנות</span>
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="18" height="18">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h5a3 3 0 013 3v1"></path>
            </svg>
          </button>
        </form>

        <!-- Register Form -->
        <form id="register-form" class="auth-form" onsubmit="handleRegister(event)">
          <div class="form-group">
            <label for="register-name">שם מלא</label>
            <div class="input-wrapper">
              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
              </svg>
              <input type="text" id="register-name" required placeholder="ישראל ישראלי">
            </div>
          </div>

          <div class="form-group">
            <label for="register-email">אימייל</label>
            <div class="input-wrapper">
              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"></path>
              </svg>
              <input type="email" id="register-email" required placeholder="name@example.com" style="direction: ltr; text-align: left;">
            </div>
          </div>

          <div class="form-group">
            <label for="register-password">סיסמה</label>
            <div class="input-wrapper">
              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
              </svg>
              <input type="password" id="register-password" required placeholder="מינימום 6 תווים" minlength="6" style="direction: ltr; text-align: left;">
            </div>
          </div>

          <button type="submit" class="auth-btn">
            <span>הרשמה לחנות</span>
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="18" height="18">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"></path>
            </svg>
          </button>
        </form>

      </div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container"></div>

  <script src="login.js"></script>
</body>
</html>
